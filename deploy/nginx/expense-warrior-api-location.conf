# Include these locations inside the existing HTTPS server block for
# node.itcontents.com. The standalone Expense Warrior API listens privately
# on 127.0.0.1:3100; the existing /api/v1/auth and other ITC routes are untouched.

location = /api/v1/expense-warrior {
    return 308 /api/v1/expense-warrior/;
}

location ^~ /api/v1/expense-warrior/ {
    client_max_body_size 6m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 190s;
    proxy_read_timeout 190s;

    # No URI suffix: preserve /api/v1/expense-warrior/... for the API router.
    proxy_pass http://127.0.0.1:3100;
}
